[project]
name = "MCP_project"
version = "0.1.0"
description = "Paste a job URL and get a resume-matched gap analysis from a LangGraph agent backed by two MCP servers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.3.11",
    "langchain-aws>=1.6.0",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph>=1.2.6",
    "mcp>=1.28.0,<2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]
